<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>My Private Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; scroll-behavior: smooth; }
        .video-thumbnail {
            background: linear-gradient(45deg, #0f172a, #1e293b);
            display: flex; align-items: center; justify-content: center;
        }
        .play-icon { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0.6; }
        .group:hover .play-icon { transform: scale(1.1); opacity: 1; color: #3b82f6; }
        
        /* Fullscreen & Cinema Mode Fixes */
        :fullscreen #modalContent {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            border: none;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #000; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="bg-black text-gray-200 min-h-screen antialiased flex flex-col custom-scrollbar">

    <!-- Navbar -->
    <nav class="border-b border-white/5 bg-black/80 backdrop-blur-xl sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="text-xl font-bold tracking-tighter text-white flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-play text-xs"></i>
                </div>
                DARK<span class="text-blue-500 font-light text-lg">COLLECTION</span>
            </div>
            
            <div class="flex-grow max-w-md mx-4">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="بحث في المجموعة..." 
                           class="w-full bg-zinc-900 border border-zinc-800 text-sm px-4 py-2 rounded-full focus:outline-none focus:border-blue-500 transition-all">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-zinc-600"></i>
                </div>
            </div>

            <div id="count-display" class="bg-zinc-900 px-3 py-1 rounded text-xs text-zinc-400 font-mono border border-zinc-800">
                0 Videos
            </div>
        </div>
    </nav>

    <!-- Grid Layout -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards injected via JS -->
        </div>
        
        <div id="noResults" class="hidden text-center py-20">
            <i class="fas fa-film text-4xl text-zinc-800 mb-4"></i>
            <p class="text-zinc-500">لا توجد فيديوهات تطابق بحثك</p>
        </div>
    </main>

    <!-- Modal Player -->
    <div id="videoModal" class="fixed inset-0 z-50 hidden bg-black/95 backdrop-blur-md flex items-center justify-center p-0 md:p-4">
        
        <!-- Close Button -->
        <button onclick="closeModal()" class="absolute top-4 right-4 text-white hover:text-red-500 z-[70] bg-black/50 rounded-full w-10 h-10 flex items-center justify-center transition-all hover:rotate-90">
            <i class="fas fa-times text-xl"></i>
        </button>

        <div id="modalContent" class="w-full max-w-5xl bg-zinc-950 md:rounded-2xl overflow-hidden shadow-2xl border border-white/5 relative flex flex-col transition-all duration-500">
            
            <!-- Modal Header -->
            <div id="modalHeader" class="p-4 border-b border-white/5 flex justify-between items-center bg-zinc-900/50">
                <h3 id="modalTitle" class="text-sm md:text-base font-medium text-white truncate max-w-[60%]"></h3>
                
                <div class="flex gap-2">
                    <button onclick="toggleCinemaMode()" class="bg-blue-600/10 hover:bg-blue-600 text-blue-400 hover:text-white px-4 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2 transition-all">
                        <i class="fas fa-expand"></i> وضع السينما
                    </button>
                    <a id="modalDownload" href="#" target="_blank" class="bg-emerald-600/10 hover:bg-emerald-600 text-emerald-400 hover:text-white px-4 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2 transition-all">
                        <i class="fas fa-download"></i> تحميل
                    </a>
                </div>
            </div>

            <!-- Video Frame -->
            <div class="aspect-video w-full bg-black relative">
                <iframe 
                    id="modalIframe" 
                    class="absolute inset-0 w-full h-full z-10" 
                    src="" 
                    frameborder="0" 
                    scrolling="no" 
                    allowfullscreen 
                    allow="autoplay; fullscreen; orientation-lock; screen-wake-lock;"
                    referrerpolicy="no-referrer">
                </iframe>
                <!-- Loading State -->
                <div id="videoLoader" class="absolute inset-0 flex items-center justify-center bg-black z-0">
                    <div class="w-10 h-10 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-10 text-zinc-600 text-xs border-t border-white/5">
        &copy; 2024 Private Collection &bull; Built with Privacy in Mind
    </footer>

    <script>
        // Fixed Array Syntax (Added missing comma)
        const myVideos = [
            { title: "Riley Reid & Gabbie Carter", link: "https://cyberfile.me/video/embed/IzU6/640x320" },
            { title: "Kendra Sunderland", link: "https://cyberfile.me/video/embed/e2xi/640x320" },
            { title: "Video 03 (gbl0)", link: "https://cyberfile.me/video/embed/gbl0/640x320" },
            { title: "Alexa Grace", link: "https://cyberfile.me/video/embed/fawm/640x320" },
            { title: "Goldie - Brake Is Back 2", link: "https://cyberfile.me/video/embed/b006/640x320" },
            { title: "Melissa Moore", link: "https://cyberfile.me/video/embed/jp42/640x320" },
            { title: "Eva Lovia", link: "https://cyberfile.me/video/embed/dM94/640x320" },
            { title: "Mia Melano, Jason Luv", link: "https://cyberfile.me/video/embed/mogD/640x320" },
            { title: "Lana Rhoades BLACKEDraw 2018", link: "https://cyberfile.me/video/embed/chnG/640x320" },
            { title: "Lana Rhoades - Cant Stop, Wont Stop", link: "https://cyberfile.me/video/embed/vzZP/640x320" },
            { title: "Gabbie Carter - The Dutiful Wife", link: "https://cyberfile.me/video/embed/fchO/640x320" },
            { title: "Gabbie Carter - Come Get Me", link: "https://cyberfile.me/video/embed/hZiD/640x320" },
            { title: "Tori Black - The Big Fight", link: "https://cyberfile.me/video/embed/fcU6/640x320" },
            { title: "AJ Applegate - BLACKED (Apr 15, 2017)", link: "https://cyberfile.me/video/embed/ckpF/640x320" },
            { title: "Haley Reed - Fashion Week BBC", link: "https://cyberfile.me/video/embed/d9JJ/640x320" }, // Added missing comma here
            { title: "Lana Rhoades - Ive Waited All Week For This - BLACKED", link: "https://cyberfile.me/video/embed/fcM4/640x320" },
            { title: "blackedraw.17.11.13.karlee.grey.4k", link: "https://cyberfile.me/video/embed/vM91/640x320" }
        ];

        const grid = document.getElementById('gallery-grid');
        const countDisplay = document.getElementById('count-display');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        function getVideoId(url) {
            const regex = /cyberfile\.me\/video\/embed\/([a-zA-Z0-9]+)/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        function renderVideos(videos) {
            grid.innerHTML = '';
            countDisplay.innerText = `${videos.length} Videos`;
            
            if (videos.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            videos.forEach((video) => {
                const videoId = getVideoId(video.link);
                const downloadLink = videoId ? `https://cyberfile.me/${videoId}` : '#';
                
                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-white/5 rounded-2xl overflow-hidden hover:border-blue-500/50 transition-all duration-300 group flex flex-col h-full";
                
                card.innerHTML = `
                    <div class="aspect-video w-full video-thumbnail cursor-pointer relative overflow-hidden" onclick="openModal('${video.link}', '${video.title.replace(/'/g, "\\'")}', '${downloadLink}')">
                        <div class="absolute inset-0 bg-black/40 group-hover:bg-transparent transition-all duration-500"></div>
                        <i class="fas fa-play text-4xl text-white play-icon relative z-10"></i>
                    </div>
                    
                    <div class="p-4 flex flex-col justify-between flex-grow">
                        <h3 class="text-sm font-semibold text-zinc-100 group-hover:text-blue-400 transition-colors line-clamp-2 mb-4" title="${video.title}">
                            ${video.title}
                        </h3>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="text-[10px] text-zinc-600 font-mono">${videoId || 'N/A'}</span>
                            <a href="${downloadLink}" target="_blank" class="text-[11px] bg-zinc-800 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg transition-all flex items-center gap-1">
                                <span>تحميل</span> <i class="fas fa-download"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Search Functionality
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = myVideos.filter(v => v.title.toLowerCase().includes(term));
            renderVideos(filtered);
        });

        // Modal Logic
        const modal = document.getElementById('videoModal');
        const modalContent = document.getElementById('modalContent');
        const modalIframe = document.getElementById('modalIframe');
        const modalTitle = document.getElementById('modalTitle');
        const modalDownload = document.getElementById('modalDownload');
        const videoLoader = document.getElementById('videoLoader');

        function openModal(url, title, downloadUrl) {
            videoLoader.classList.remove('hidden');
            modalIframe.src = url;
            modalTitle.innerText = title;
            modalDownload.href = downloadUrl;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            modalIframe.onload = () => {
                videoLoader.classList.add('hidden');
            };
        }

        function closeModal() {
            modal.classList.add('hidden');
            modalIframe.src = "";
            document.body.style.overflow = 'auto';
            if (document.fullscreenElement) document.exitFullscreen();
            try { if (screen.orientation) screen.orientation.unlock(); } catch(e) {}
        }

        async function toggleCinemaMode() {
            try {
                if (!document.fullscreenElement) {
                    if (modalContent.requestFullscreen) await modalContent.requestFullscreen();
                    else if (modalContent.webkitRequestFullscreen) await modalContent.webkitRequestFullscreen();
                    
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(() => {});
                    }
                } else {
                    document.exitFullscreen();
                }
            } catch (err) {
                console.warn("Fullscreen/Orientation error:", err);
            }
        }

        // Close on Esc
        document.addEventListener('keydown', (e) => { if (e.key === "Escape") closeModal(); });

        // Initial Render
        renderVideos(myVideos);
    </script>
</body>
</html>
